services:
  matches:
    build: .
    command: node src/matches/index.js
    environment:
      PORT: 4001
      DATA_DIR: /app/data
      OTEL_SDK_DISABLED: "false"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    volumes:
      - sqlite-data:/app/data
      - ./data/raw:/app/data/raw
    ports: ["4001:4001"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      retries: 20
      start_period: 15s
  teams:
    build: .
    command: node src/teams/index.js
    environment:
      PORT: 4002
      DATA_DIR: /app/data
      OTEL_SDK_DISABLED: "false"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    volumes:
      - sqlite-data:/app/data
      - ./data/raw:/app/data/raw
    ports: ["4002:4002"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      retries: 20
      start_period: 15s
  users:
    build: .
    command: node src/users/index.js
    environment:
      PORT: 4003
      DATA_DIR: /app/data
      OTEL_SDK_DISABLED: "false"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    volumes:
      - sqlite-data:/app/data
      - ./data/raw:/app/data/raw
    ports: ["4003:4003"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4003/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      retries: 20
      start_period: 15s
  gateway:
    build: .
    command: node src/gateway/index.js
    environment:
      PORT: 4000
      MATCHES_URL: http://matches:4001/graphql
      TEAMS_URL: http://teams:4002/graphql
      USERS_URL: http://users:4003/graphql
      OTEL_SDK_DISABLED: "false"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      RATE_LIMIT_POINTS: 180
    ports: ["4000:4000"]
    depends_on:
      matches: { condition: service_healthy }
      teams: { condition: service_healthy }
      users: { condition: service_healthy }
  ingest:
    build: .
    command: node src/ingest/index.js
    environment:
      DATA_DIR: /app/data
      FOOTBALL_DATA_KEY: ${FOOTBALL_DATA_KEY:-}
      THESPORTSDB_KEY: ${THESPORTSDB_KEY:-123}
      OTEL_SDK_DISABLED: "true"
    volumes:
      - sqlite-data:/app/data
      - ./data/raw:/app/data/raw
    restart: "no"
  prometheus:
    image: prom/prometheus:v2.55.1
    volumes: [./prometheus.yml:/etc/prometheus/prometheus.yml:ro]
    ports: ["9090:9090"]
  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboard.json:/var/lib/grafana/dashboards/football.json:ro
    ports: ["3001:3000"]
    depends_on: [prometheus]
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports: ["16686:16686", "4318:4318"]

volumes:
  sqlite-data:
