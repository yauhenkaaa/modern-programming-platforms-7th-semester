services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: go
    ports:
      - "5433:5432"
    volumes:
      - go_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d go"]
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  go_data:
