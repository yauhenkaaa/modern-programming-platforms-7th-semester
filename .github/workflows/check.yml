name: check

on:
  push:
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: syntax
        run: |
          node --check server/src/log.js
          node --check server/src/db.js
          node --check server/src/auth.js
          node --check server/src/players.js
          node --check server/src/reports.js
          node --check server/src/index.js
          node --check server/scripts/seed.js
  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
